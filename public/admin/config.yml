# 可视化内容后台配置（Decap CMS）
backend:
  name: github
  repo: chunyun1998-sudo/jack-3d-creator
  branch: main
  auth_type: implicit
  app_id: Ov23likOI5ZBm0jbjIgP

# 上传的图片统一存入仓库 public/uploads 目录，页面中以 /uploads/... 引用
media_folder: public/uploads
public_folder: /uploads

locale: zh_Hans

collections:
  - name: site
    label: 网站管理
    files:
      - name: config
        label: 内容与主题
        file: src/data/site-config.json
        format: json
        fields:
          - label: 网站
            name: site
            widget: object
            collapsed: true
            fields:
              - { label: 网站标题（浏览器标签页显示）, name: title, widget: string }
          - label: 全局主题颜色
            name: theme
            widget: object
            collapsed: true
            fields:
              - { label: 深色背景色, name: background, widget: color, allow_input: true }
              - { label: 浅色区块背景色（服务区）, name: surface, widget: color, allow_input: true }
              - { label: 正文文字颜色, name: text, widget: color, allow_input: true }
              - { label: 大标题渐变起始色, name: headingStart, widget: color, allow_input: true }
              - { label: 大标题渐变结束色, name: headingEnd, widget: color, allow_input: true }
          - label: 首屏区
            name: hero
            widget: object
            collapsed: true
            fields:
              - label: 导航菜单（每行一个链接文字）
                name: navLinks
                widget: list
                label_singular: 链接
              - { label: 大标题文字, name: heading, widget: string }
              - { label: 副标题文字, name: subheading, widget: text }
              - { label: 头像图片, name: portrait, widget: image, choose_url: true }
          - label: 动图墙（每行一个 GIF 链接，可增删）
            name: marquee
            widget: object
            collapsed: true
            fields:
              - label: 第一行动图链接
                name: row1
                widget: list
                label_singular: 链接
              - label: 第二行动图链接
                name: row2
                widget: list
                label_singular: 链接
          - label: 关于我
            name: about
            widget: object
            collapsed: true
            fields:
              - { label: 标题, name: heading, widget: string }
              - { label: 介绍文字, name: text, widget: text }
              - label: 四角装饰图（可选）
                name: decor
                widget: object
                collapsed: true
                fields:
                  - { label: 左上角图片, name: topLeft, widget: image, choose_url: true }
                  - { label: 左下角图片, name: bottomLeft, widget: image, choose_url: true }
                  - { label: 右上角图片, name: topRight, widget: image, choose_url: true }
                  - { label: 右下角图片, name: bottomRight, widget: image, choose_url: true }
          - { label: 服务区大标题, name: servicesHeading, widget: string }
          - label: 服务列表
            name: services
            widget: list
            label_singular: 服务
            fields:
              - { label: 编号（如 01）, name: num, widget: string }
              - { label: 服务名称, name: name, widget: string }
              - { label: 服务描述, name: desc, widget: text }
          - { label: 作品区大标题, name: projectsHeading, widget: string }
          - label: 作品集
            name: projects
            widget: list
            label_singular: 作品
            fields:
              - { label: 编号（如 01）, name: num, widget: string }
              - { label: 类型（Client / Personal）, name: category, widget: string }
              - { label: 作品名称, name: name, widget: string }
              - { label: 左列上图, name: image1, widget: image, choose_url: true }
              - { label: 左列下图, name: image2, widget: image, choose_url: true }
              - { label: 右列大图, name: image3, widget: image, choose_url: true }
